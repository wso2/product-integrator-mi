name: DB tests (PostgreSQL 18.3)

on: [workflow_dispatch, pull_request]

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: Root
          POSTGRES_PASSWORD: Root1234
          # DatabaseManager's maintenance connection uses a URL with no db name,
          # which the JDBC driver defaults to the username.
          POSTGRES_DB: Root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U Root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21.0.4'

      - name: Switch test configs to Postgres
        run: |
          for m in tests-coordination tests-userstore tests-transaction; do
            conf=integration/mediation-tests/tests-platform/$m/src/test/resources/artifacts/ESB/server/conf
            cp $conf/deployment.toml.postgres $conf/deployment.toml
          done

      - name: Build MI
        run: mvn -B clean install -DskipTests --file pom.xml

      - name: Run DB tests
        run: mvn -B clean install --file integration/pom.xml -P db-tests
